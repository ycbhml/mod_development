[Constants]
; if you have issues with menu, try to set up here
; Screen resolution values for menu
global $window_width = 1920
global $window_height = 1080
; The rest should stay intact 

; MENU CODE VARS
; Editing this can ruin menu
global $menu = 0
global persist $AnimFrame = 0

global $MLX = 35
global $MLY = 250
global $IconsPerLine = 6
global persist $MenuSize = 0

; Menu size full
global $MsW = 670
global $MsH = 710
global $HsH = 40
global $is = 100
global $io = 10

global $DefaultMsW = 670
global $DefaultMsH = 710
global $DefaultHsH = 40
global $Defaultis = 100
global $Defaultio = 10
; Menu size full

; Menu size half
; global $MsW = 335
; global $MsH = 355
; global $HsH = 20
; global $is = 50
; global $io = 5
; Menu size half

global $mz
global $mw
global $hh
global $IconX
global $IconY
global $ww
global $wh
global $cpx
global $cpy

global $Mode = 0
global $Click
global $Hover
global $IconHovered
global $St
global $Dr
global $Lm

global $kcY
global $kcX
global $ImX
global $ImY

global $SlH
global $SlO
global $SlV

global $Page = 0

; Keys to call menu and clicks
; LeftMouseButton (LMB) forward swap direction
; RightMouseButton (RMB) backward swap direction
[KeyToggleMenu]
condition = $active == 1
key = /
type = cycle
$menu = 1,0
$Mode = 0,0

[KeyClickLMB]
condition = $menu == 1 && ( $Hover == 1 || $Mode != 0 )
key = no_ctrl no_shift VK_LBUTTON
run = CommandListClickForward

[KeyClickRMB]
condition = $menu == 1 && ( $Hover == 1 || $Mode != 0 )
key = no_ctrl no_shift VK_RBUTTON
run = CommandListClickBackward

[KeyHoldLMB]
condition = $menu == 1 && ( $Hover == 1 || $Mode != 0 )
key = no_ctrl no_shift VK_LBUTTON
type = hold
delay = 200
$Click = 1
run = CommandListClickForward

[KeyHoldRMB]
condition = $menu == 1 && ( $Hover == 1 || $Mode != 0 )
key = no_ctrl no_shift VK_RBUTTON
type = hold
delay = 200
$Click = 1
run = CommandListClickBackward

[KeyNavMenu-Up]
condition = $menu == 1
key = no_ctrl no_shift VK_NUMPAD8
run = CommandListNavMenuUp

[KeyNavMenu-Down]
condition = $menu == 1
key = no_ctrl no_shift VK_NUMPAD2
run = CommandListNavMenuDown

[KeyNavMenu-Left]
condition = $menu == 1
key = no_ctrl no_shift VK_NUMPAD4
run = CommandListNavMenuLeft

[KeyNavMenu-Right]
condition = $menu == 1
key = no_ctrl no_shift VK_NUMPAD6
run = CommandListNavMenuRight

[KeyNavMenu-SelectForward]
condition = $menu == 1
key = no_ctrl no_shift VK_NUMPAD5
run = CommandListNavMenuSelectForward

[KeyNavMenu-SelectBackward]
condition = $menu == 1
key = no_ctrl no_shift VK_NUMPAD0
run = CommandListNavMenuSelectBackward

[KeyNavMenu-SelectForward-Hold]
condition = $menu == 1
key = no_ctrl no_shift VK_NUMPAD5
type = hold
delay = 200
$Click = 1
run = CommandListNavMenuSelectForward

[KeyNavMenu-SelectBackward-Hold]
condition = $menu == 1
key = no_ctrl no_shift VK_NUMPAD0
type = hold
delay = 200
$Click = 1
run = CommandListNavMenuSelectBackward

[Present]

	$AnimFrame = (time * 3 % (18 - 1 + 1) + 1) // 1

if $active && $menu
	run = CommandListMenu
	
	if $Mode == 4
		$MLX = ( $cpx * $ww ) //1 - (($io * $ImX) + $is * ($ImX - 1)) - ($is / 2)
		$MLY = ( $cpy * $wh ) //1 - (($io * $ImY) + $is * ($ImY - 1)) - ($is / 2) - $HsH
	endif
		
	if ( $MLX < 0 )
		$MLX = 0
	elif ( $MLX > $ww - $MsW ) 
		$MLX = $ww - $MsW
	endif

	if ( $MLY < 0 ) 
		$MLY = 0
	elif ( $MLY > $wh - $MsH ) 
		$MLY = $wh - $MsH
	endif
	
	if $Click
		run = CommandListTogglesProcess
	endif
endif

; Overrides -------------------------


; CommandList -----------------------

[CommandListMetrics]
if window_width != 0
  $ww = window_width
  $wh = window_height
elif rt_width != 0
  $ww = rt_width
  $wh = rt_height
elif res_width != 0
  $ww = res_width
  $wh = res_height
else
  $ww = $window_width
  $wh = $window_height
endif

if cursor_x > 0 && cursor_y > 0 && cursor_x < 1 && cursor_y < 1
	$cpx = cursor_x
	$cpy = cursor_y
elif cursor_window_x > 0 && cursor_window_y > 0 && cursor_window_x < 1 && cursor_window_y < 1
	$cpx = cursor_window_x / $ww
	$cpy = cursor_window_y / $wh
else
	$cpx = cursor_screen_x / $ww
	$cpy = cursor_screen_y / $wh
endif

[CommandListButtonCondition]
    if ( $cpx > z87 && $cpx < z87 + x87 && $cpy > w87 && $cpy < w87 + y87 ) && $Mode == 0
		$Hover = 1
		$IconHovered = ($IconY - 1) * $IconsPerLine + $IconX
		ps-t100 = ResourceIconFrameHover
		run = CustomShaderElement
	else
		ps-t100 = ResourceIconFrameNormal
		run = CustomShaderElement
	endif

[CommandListIconProperties]
	x87 = $is / $ww
	y87 = $is / $wh
    z87 = (($io * $IconX) + $is * ($IconX - 1)) / $ww + $mz
	w87 = (($io * $IconY) + $is * ($IconY - 1)) / $wh + $mw + $hh
	
[CommandListIconPropertiesSlider]
	$SlH = $is * $SlV
	$SlO = $is * (1 - $SlV)
	
	x87 = $is / $ww
	y87 = $SlH / $wh
    z87 = (($io * $IconX) + $is * ($IconX - 1)) / $ww + $mz
	w87 = (($io * $IconY) + $is * ($IconY - 1) + $SlO) / $wh + $mw + $hh
	
[CommandListClickForward]
if $Mode != 0
	$Mode = 0
elif $Mode == 0
	$Dr = 1
	run = CommandListTogglesProcess
endif

[CommandListClickBackward]
if $Mode != 0
	$Mode = 0
elif $Mode == 0
	$Dr = -1
	run = CommandListTogglesProcess
endif

[CommandListNavMenuUp]
if $Mode == 0
	$Mode = 1
elif $Mode == 2
	$kcY = $kcY - 1
	if $kcY < 1
		$kcY = 6
	endif
elif $Mode == 3
	$MLY = $MLY - 20
endif

[CommandListNavMenuDown]
if $Mode == 0
	$Mode = 1
elif $Mode == 2
	$kcY = $kcY + 1
	if $kcY > 6
		$kcY = 1
	endif
elif $Mode == 3
	$MLY = $MLY + 20
endif

[CommandListNavMenuLeft]
if $Mode == 0
	$Mode = 1
elif $Mode == 2
	$kcX = $kcX - 1
	if $kcX < 1
		$kcX = 6
	endif
elif $Mode == 3
	$MLX = $MLX - 40
endif

[CommandListNavMenuRight]
if $Mode == 0
	$Mode = 1
elif $Mode == 2
	$kcX = $kcX + 1
	if $kcX > 6
		$kcX = 1
	endif
elif $Mode == 3
	$MLX = $MLX + 40
endif

[CommandListNavMenuSelectForward]
if $Mode == 0
	$Mode = 1
elif $Mode == 2
	$Dr = 1
	run = CommandListTogglesProcess
elif $Mode == 3
	$Mode = 1
endif

[CommandListNavMenuSelectBackward]
if $Mode == 0
	$Mode = 1
elif $Mode == 2
	$Dr = -1
	run = CommandListTogglesProcess
elif $Mode == 3
	$Mode = 1
endif

[CommandListKeyboardNavigation]
	$IconX = $kcX
	$IconY = $kcY
	run = CommandListIconProperties
	$IconHovered = ($IconY - 1) * $IconsPerLine + $IconX
    ps-t100 = ResourceIconFrameHover
    run = CustomShaderElement

; [CommandListToggleLimits]
	; $St = $
	; $Lm = 
	; $St = ($St + $Dr + $Lm) % $Lm
	; $ = $St

[CommandListTogglesProcess]
; TPNT
if $IconHovered == 1
	if $Mode == 0
		$Mode = 4
	else
		$Mode = 3
	endif
elif $IconHovered == 2
	$St = $MenuSize
	$Lm = 6
	$St = ($St + $Dr + $Lm) % $Lm
	$MenuSize = $St
	if $MenuSize == 0
		$MsW = $DefaultMsW 
		$MsH = $DefaultMsH
		$HsH = $DefaultHsH
		$is = $Defaultis
		$io = $Defaultio
	elif $MenuSize  == 1
		$MsW = $DefaultMsW * 0.9
		$MsH = $DefaultMsH * 0.9
		$HsH = $DefaultHsH * 0.9
		$is = $Defaultis * 0.9
		$io = $Defaultio * 0.9
	elif $MenuSize  == 2
		$MsW = $DefaultMsW * 0.8
		$MsH = $DefaultMsH * 0.8
		$HsH = $DefaultHsH * 0.8
		$is = $Defaultis * 0.8
		$io = $Defaultio * 0.8
	elif $MenuSize  == 3
		$MsW = $DefaultMsW * 0.7
		$MsH = $DefaultMsH * 0.7
		$HsH = $DefaultHsH * 0.7
		$is = $Defaultis * 0.7
		$io = $Defaultio * 0.7
	elif $MenuSize  == 4
		$MsW = $DefaultMsW * 0.6
		$MsH = $DefaultMsH * 0.6
		$HsH = $DefaultHsH * 0.6
		$is = $Defaultis * 0.6
		$io = $Defaultio * 0.6
	elif $MenuSize  == 5
		$MsW = $DefaultMsW * 0.5
		$MsH = $DefaultMsH * 0.5
		$HsH = $DefaultHsH * 0.5
		$is = $Defaultis * 0.5
		$io = $Defaultio * 0.5
	endif
		; X=1 Y=6
elif $IconHovered == 31
	$St = $Page
	$Lm = 2
	$St = ($St + $Dr + $Lm) % $Lm
	$Page = $St
endif

if $Page == 0
		; X=3 Y=1
	if $IconHovered == 3
		$Shoe = 1 - $Shoe
		
		; X=4 Y=1
	elif $IconHovered == 4

		; X=5 Y=1
	elif $IconHovered == 5

		; X=6 Y=1
	elif $IconHovered == 6
		$ReColor = 1 - $ReColor

		; X=1 Y=2
	elif $IconHovered == 7
		$St = $NavelPiercing
		$Lm = 3
		$St = ($St + $Dr + $Lm) % $Lm
		$NavelPiercing = $St


		; X=2 Y=2
	elif $IconHovered == 8
		$St = $LeftArmAc
		$Lm = 3
		$St = ($St + $Dr + $Lm) % $Lm
		$LeftArmAc = $St
