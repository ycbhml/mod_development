; Constants ---------------------------

[Constants]
global $ActiveCharacter = 0
global $speed = 0.5
global $frameStart= 0
global $frameEnd = 20
global $swapvar = 0
global $auxTime = 0

[Present]
if $auxTime % $speed == 0
